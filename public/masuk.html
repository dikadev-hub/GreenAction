<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — GreenAction</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<section style="padding:56px 0">
  <div class="container-sm">
    <div class="panel" style="max-width:440px;margin:0 auto;padding:36px">
      <h2 style="color:var(--deep)">Masuk ke GreenAction</h2>
      <p style="color:var(--mut);font-size:.92rem;margin-bottom:24px">Lanjutkan aksi lingkunganmu.</p>
      <div id="msg"></div>
      <form id="loginForm" class="form">
        <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="pass">Password</label><input id="pass" type="password" required autocomplete="current-password" minlength="8"></div>
        <button class="btn btn-primary" type="submit" style="width:100%">Masuk</button>
      </form>
      <p style="text-align:center;margin-top:18px;font-size:.9rem;color:var(--mut)">Belum punya akun? <a href="/daftar" style="color:var(--green);font-weight:700">Daftar sekarang</a></p>
    </div>
  </div>
</section>
<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('header').innerHTML=GA.headerHTML();
document.getElementById('footer').innerHTML=GA.footerHTML();
if(GA.getToken()) location.href='/dashboard.html';
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const d=await GA.api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});
  const msg=document.getElementById('msg');
  if(d.success){ GA.setSession(d.token,d.user); location.href=d.user.role==='admin'?'/admin.html':'/dashboard.html'; }
  else msg.innerHTML='<div class="form-error">'+GA.esc(d.message)+'</div>';
});
</script>
</body>
</html>
