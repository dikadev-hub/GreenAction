<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="t">Artikel — GreenAction</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div class="container-sm" style="padding-top:48px" id="wrap"><div class="skeleton" style="height:200px;border-radius:20px"></div></div>
<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('header').innerHTML=GA.headerHTML('edukasi');
document.getElementById('footer').innerHTML=GA.footerHTML();
const id=location.pathname.split('/').pop();
GA.api('/articles/'+id).then(d=>{
  if(!d.success){ document.getElementById('wrap').innerHTML='<p style="padding:60px 0;color:var(--mut)">Artikel tidak ditemukan.</p>'; return; }
  const a=d.item;
  document.getElementById('t').textContent=a.judul+' — GreenAction';
  document.getElementById('wrap').innerHTML=`
  <a href="/edukasi" style="color:var(--mut);font-size:.9rem;font-weight:600">← Semua artikel</a>
  <span class="tag green" style="margin-left:10px">${GA.esc(a.kategori)}</span>
  <h1 style="font-size:2.1rem;color:var(--deep);margin:18px 0;letter-spacing:-.02em">${GA.esc(a.judul)}</h1>
  <div style="font-size:.85rem;color:var(--mut);margin-bottom:24px">${a.tanggal}</div>
  <img src="${a.foto}" alt="" style="border-radius:20px;width:100%;aspect-ratio:16/8;object-fit:cover">
  <p style="margin:28px 0;font-size:1.12rem;color:var(--ink);font-weight:600">${GA.esc(a.ringkas)}</p>
  <p style="color:var(--mut);font-size:1.02rem">${GA.esc(a.isi)}</p>
  <div class="panel" style="margin-top:30px"><b style="font-size:.85rem">Sumber:</b><div style="font-size:.9rem;color:var(--mut);margin-top:4px">${GA.esc(a.sumber)}</div></div>`;
});
</script>
</body>
</html>
