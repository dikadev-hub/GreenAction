<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komunitas — GreenAction</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<section style="padding:56px 0 24px">
  <div class="container">
    <div class="sec-head">
      <div class="kicker">Community Directory</div>
      <h2>Komunitas Lingkungan Indonesia</h2>
      <p>Komunitas terverifikasi yang aktif menggerakkan aksi lingkungan di daerahnya.</p>
    </div>
    <div class="grid grid-3" id="list"></div>
  </div>
</section>
<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('header').innerHTML=GA.headerHTML('komunitas');
document.getElementById('footer').innerHTML=GA.footerHTML();
GA.api('/communities').then(d=>{
  document.getElementById('list').innerHTML=d.items.map(k=>`
    <article class="card">
      <img class="thumb" src="${k.foto}" alt="${GA.esc(k.nama)}" loading="lazy">
      <div class="body">
        <h3>${GA.esc(k.nama)}</h3>
        <p class="desc">${GA.esc(k.deskripsi)}</p>
        <div class="meta"><span>${GA.fmt(k.anggota)} anggota</span><span>${k.kegiatan} kegiatan</span><span>📍 ${GA.esc(k.lokasi)}</span></div>
        <div class="foot"><a class="btn btn-primary btn-sm" href="/komunitas/${k.id}">Profil</a>${k.terverifikasi?'<span class="tag blue">Terverifikasi</span>':''}</div>
      </div>
    </article>`).join('');
});
</script>
</body>
</html>
