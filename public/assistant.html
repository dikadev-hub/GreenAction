<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Assistant — GreenAction</title>
<meta name="description" content="Asisten informasi lingkungan GreenAction: panduan memilah sampah, kebiasaan ramah lingkungan, dan navigasi platform.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<section style="padding:48px 0 24px">
  <div class="container-sm">
    <div class="sec-head">
      <div class="kicker">Green Assistant</div>
      <h2>Asisten Informasi Lingkungan</h2>
      <p>Tanya apa saja seputar edukasi lingkungan, pemilahan sampah, dan cara menggunakan GreenAction.</p>
    </div>
    <div class="panel" style="padding:0;overflow:hidden">
      <div id="chat" style="max-height:480px;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px"></div>
      <div style="border-top:1px solid var(--line);padding:14px;display:flex;gap:10px">
        <input id="msg" placeholder="Tulis pertanyaanmu…" aria-label="Pesan" style="flex:1;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px" maxlength="300">
        <button class="btn btn-primary" id="send">Kirim</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px" id="sugg"></div>
    <div class="panel" style="margin-top:20px;background:var(--mint)">
      <p style="font-size:.85rem;color:var(--mut)"><b>Tentang asisten ini:</b> <span id="modeInfo"></span></p>
    </div>
  </div>
</section>
<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('header').innerHTML=GA.headerHTML('assistant');
document.getElementById('footer').innerHTML=GA.footerHTML();
const chat=document.getElementById('chat');
function bubble(text,me){
  const el=document.createElement('div');
  el.style.cssText=me?'align-self:flex-end;background:var(--deep);color:#fff;padding:12px 16px;border-radius:16px 16px 4px 16px;max-width:80%;font-size:.93rem'
    :'align-self:flex-start;background:var(--mint);color:var(--ink);padding:12px 16px;border-radius:16px 16px 16px 4px;max-width:85%;font-size:.93rem;white-space:pre-wrap';
  el.textContent=text; chat.appendChild(el); chat.scrollTop=chat.scrollHeight; return el;
}
bubble('Halo! Saya Green Assistant 👋 — '+(GA.getUser()? 'Mau tanya apa hari ini?':'Tanyakan hal seputar lingkungan atau cara pakai GreenAction.'));
GA.api('/assistant/status').then(d=>{
  document.getElementById('modeInfo').textContent = d.mode==='ai'
    ? 'Didukung model AI melalui integrasi server-side. Jawaban dapat berbeda-beda — verifikasi informasi penting pada sumber resmi.'
    : 'Saat ini berjalan dalam mode pencarian topik berbasis basis pengetahuan terkurasi GreenAction (tanpa model AI eksternal). Integrasi AI disiapkan modular dan aktif ketika provider tersedia.';
});
const SUGG=['Bagaimana cara memilah sampah?','Apa itu kompos?','Tips hemat air sehari-hari','Apa itu Green Map?','Bagaimana cara ikut kegiatan?'];
document.getElementById('sugg').innerHTML=SUGG.map(s=>`<button class="chip">${s}</button>`).join('');
document.getElementById('sugg').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(b){ document.getElementById('msg').value=b.textContent; send(); }
});
async function send(){
  const inp=document.getElementById('msg');
  const q=inp.value.trim(); if(!q)return;
  inp.value=''; bubble(q,true);
  const loading=bubble('Sedang mencari jawaban…',false);
  const d=await GA.api('/assistant/ask',{method:'POST',body:JSON.stringify({message:q})});
  loading.remove();
  bubble(d.reply||'Maaf, saya belum bisa menjawab itu. Coba topik lain.',false);
}
document.getElementById('send').addEventListener('click',send);
document.getElementById('msg').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
