<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — GreenAction</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<section style="padding:56px 0">
  <div class="container-sm">
    <div class="panel" style="max-width:460px;margin:0 auto;padding:36px">
      <h2 style="color:var(--deep)">Buat Akun Relawan</h2>
      <p style="color:var(--mut);font-size:.92rem;margin-bottom:24px">Gratis — mulai catat kontribusimu hari ini.</p>
      <div id="msg"></div>
      <form id="regForm" class="form">
        <div class="field"><label for="nama">Nama lengkap</label><input id="nama" required maxlength="60"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="form-row">
          <div class="field"><label for="pass">Password (min. 8)</label><input id="pass" type="password" required minlength="8" autocomplete="new-password"></div>
          <div class="field"><label for="pass2">Ulangi password</label><input id="pass2" type="password" required minlength="8"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="kota">Kota/kabupaten</label><input id="kota" required maxlength="60"></div>
          <div class="field"><label for="lokasi">Provinsi</label><input id="provinsi" maxlength="40"></div>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Daftar</button>
      </form>
      <p style="text-align:center;margin-top:18px;font-size:.9rem;color:var(--mut)">Sudah punya akun? <a href="/masuk" style="color:var(--green);font-weight:700">Masuk</a></p>
    </div>
  </div>
</section>
<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('header').innerHTML=GA.headerHTML();
document.getElementById('footer').innerHTML=GA.footerHTML();
document.getElementById('regForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('msg');
  if(pass.value!==pass2.value){ msg.innerHTML='<div class="form-error">Password tidak sama.</div>'; return; }
  const d=await GA.api('/auth/register',{method:'POST',body:JSON.stringify({
    nama:nama.value,email:email.value,password:pass.value,kota:kota.value,provinsi:provinsi.value})});
  if(d.success){ GA.setSession(d.token,d.user); location.href='/dashboard.html'; }
  else msg.innerHTML='<div class="form-error">'+GA.esc(d.message)+'</div>';
});
</script>
</body>
</html>
