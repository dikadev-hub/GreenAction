<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Challenge — GreenAction</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<section style="padding:56px 0 24px">
  <div class="container">
    <div class="sec-head">
      <div class="kicker">Eco Challenge</div>
      <h2>Tantangan Lingkungan</h2>
      <p>Kebiasaan kecil setiap hari. Selesaikan tantangan, kumpulkan poin, dan bangun streak-mu. Poin tantangan berbeda dari dampak terverifikasi.</p>
    </div>
    <div class="grid grid-3" id="list"></div>
  </div>
</section>
<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('header').innerHTML=GA.headerHTML();
document.getElementById('footer').innerHTML=GA.footerHTML();
let mine=[];
const LEVEL={'Mudah':'green','Sedang':'warn','Sulit':'red'};
const ICONS={'ban':'🚫','tint':'💧','seedling':'🌱','recycle':'♻️','bicycle':'🚲','users':'👥'};
async function load(){
  if(GA.getToken()){ const d=await GA.api('/my/challenges'); mine=d.items||[]; }
  const d=await GA.api('/challenges');
  document.getElementById('list').innerHTML=d.items.map(c=>{
    const rec=mine.find(m=>m.challengeId===c.id);
    const prog=rec?rec.progress:0, done=rec&&rec.selesai;
    return `<article class="card">
      <div class="body">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:2rem">${ICONS[c.ikon]||'🌍'}</span>
          <span class="tag ${LEVEL[c.tingkat]||''}">${c.tingkat}</span>
        </div>
        <h3 style="margin-top:12px">${GA.esc(c.judul)}</h3>
        <p class="desc">${GA.esc(c.deskripsi)}</p>
        <div class="meta"><span class="tag">⏱ ${c.periode}</span><span class="tag green">+${c.poin} poin</span></div>
        ${prog?`<div class="progress" style="margin-top:16px"><i style="width:${Math.min(prog/7*100,100)}%"></i></div>
        <div class="progress-lbl"><span>Progres: ${prog}/7 hari</span><span>🔥 Streak ${rec.streak}</span></div>`:''}
        <div class="foot">
          ${done?'<span class="badge Approved">Selesai ✓</span>'
            :`<button class="btn btn-primary btn-sm" onclick="doProg('${c.id}')">${prog?'Lanjutkan (hari '+(prog+1)+')':'Mulai Tantangan'}</button>`}
        </div>
      </div>
    </article>`;}).join('');
}
async function doProg(id){
  if(!GA.requireLogin())return;
  const d=await GA.api('/challenges/'+id+'/progress',{method:'POST'});
  if(d.success){ GA.toast(d.selesai?'Tantangan selesai! Poin ditambahkan 🎉':'Hari '+d.progress+' tercatat — streak '+d.streak); load(); }
  else GA.toast(d.message||'Gagal');
}
load();
</script>
</body>
</html>
